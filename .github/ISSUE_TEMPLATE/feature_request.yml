name: Feature Request
description: Suggest an idea or new constraint for the rota optimizer
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the Rota Optimizer!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the scheduling pain point.
      placeholder: e.g. In our restaurant, we have workers who cannot work past 10 PM on school nights...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: How should the solver or UI handle this?
    validations:
      required: true
